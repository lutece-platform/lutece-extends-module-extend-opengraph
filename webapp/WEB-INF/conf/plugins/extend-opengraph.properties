################################################################################
# Configuration file for Extend Opengraph plugin

module.extend.opengraph.manage_opengraph_socialhub.itemsPerPage=50

# URL of the default image for opengraph. If the URL does NOT starts with "http://", then the base URL is prefixed to the given URL
module.extend.opengraph.defaultImageUrl=images/logo-header.png

# The social hub contents (header, body, footer) typed in the back office go through the core XSS filter:
# with lutece.safe.request.admin.sanitizeFilterMode=true (core default) their <script> tags and data-* attributes are removed.
# A site that stores third-party widget scripts must set lutece.safe.request.admin.sanitizeFilterMode=false.
